# A project-level configuration file that specifies the project id.
[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 15

[studio]
enabled = true
port = 54323
api_url = "http://127.0.0.1"

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:5173"
additional_redirect_urls = ["https://127.0.0.1:5173"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
refresh_token_reuse_interval = 10
enable_signup = true

[auth.email]
enable_signup = true
double_confirm_changes = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "oneshot"
inspector_port = 8083

# Explicit per-function JWT verification, so it's version-controlled instead
# of depending on remembering a --verify-jwt / --no-verify-jwt CLI flag at
# deploy time (a previous --no-verify-jwt deploy otherwise sticks silently).
[functions.parse-goal]
verify_jwt = true

[functions.generate-path]
verify_jwt = true

[functions.get-recommendations]
verify_jwt = true

[functions.update-progress]
verify_jwt = true

[functions.generate-quiz]
verify_jwt = true

[functions.submit-quiz]
verify_jwt = true

[functions.ask-assistant]
verify_jwt = true

[functions.explain-path-item]
verify_jwt = true
